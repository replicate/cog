name: Bonk
description: Run Bonk with a Nemotron fallback when Kimi fails

inputs:
  prompt:
    description: Prompt to send to Bonk
    required: false
    default: ''
  mentions:
    description: Comma-separated trigger phrases
    required: false
    default: '/bonk,@ask-bonk'
  token_permissions:
    description: Scope the Bonk installation token
    required: false
    default: 'WRITE'

runs:
  using: composite
  steps:
    - name: Run Bonk with Kimi
      id: kimi
      continue-on-error: true
      uses: ask-bonk/ask-bonk/github@main
      with:
        model: 'cf-gateway/kimi-k2.7-code'
        mentions: ${{ inputs.mentions }}
        forks: 'false'
        permissions: write
        opencode_version: '1.18.13'
        token_permissions: ${{ inputs.token_permissions }}
        prompt: ${{ inputs.prompt }}

    - name: Prepare fallback prompt
      id: fallback-prompt
      if: steps.kimi.outcome == 'failure'
      shell: bash
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
      run: |
        prompt="$INPUT_PROMPT"
        if [ -z "$prompt" ]; then
          prompt="$(jq -r '.comment.body // .review.body // empty' "$GITHUB_EVENT_PATH")"
        fi

        delimiter="$(uuidgen)"
        {
          echo "value<<$delimiter"
          printf '%s\n' "$prompt"
          printf '\nStart your final response with: Note: this run used the Nemotron fallback model.\n'
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Retry Bonk with Nemotron
      if: steps.kimi.outcome == 'failure'
      uses: ask-bonk/ask-bonk/github@main
      with:
        model: 'cf-gateway/nemotron-3-120b-a12b'
        mentions: ${{ inputs.mentions }}
        forks: 'false'
        permissions: write
        opencode_version: '1.18.13'
        token_permissions: ${{ inputs.token_permissions }}
        prompt: ${{ steps.fallback-prompt.outputs.value }}
