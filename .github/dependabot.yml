version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
  - package-ecosystem: "cargo"
    directory: "/crates"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/playground"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to major tags (e.g. @v4), which float to the latest
    # minor/patch. Only surface major-version bumps so Dependabot doesn't churn
    # on minor/patch updates that the major tag already tracks.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
