name: Playground

on:
  merge_group:
  pull_request:
    paths:
      - "playground/**"
      - "pkg/cli/playground/**"
      - "pkg/cli/playground.go"
      - "mise.toml"
      - ".github/workflows/playground.yaml"
      - ".github/workflows/release-build.yaml"
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "pkg/cli/playground/**"
      - "pkg/cli/playground.go"
      - "mise.toml"
      - ".github/workflows/playground.yaml"
      - ".github/workflows/release-build.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Check formatting
        run: mise run fmt:playground
      - name: Lint
        run: mise run lint:playground
      - name: Type check
        run: mise run typecheck:playground
      - name: Test
        run: mise run test:playground
      - name: Build embedded assets
        run: mise run build:playground --force
      - name: Verify embedded assets are current
        run: test -z "$(git status --porcelain -- pkg/cli/playground)"
