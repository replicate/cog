[package]
name = "coglet-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # Published to PyPI as 'coglet' wheel, not crates.io
build = "build.rs"

[lib]
name = "coglet"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22"
coglet_core = { path = "../coglet", package = "coglet", default-features = false }
futures.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
pyo3-stub-gen.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sentry.workspace = true
tracing-opentelemetry = { version = "=0.33.0", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
tempfile = "3"

[features]
default = ["tracing", "tracing-grpc"]
extension-module = ["pyo3/extension-module"]
tracing = ["coglet_core/tracing", "dep:tracing-opentelemetry"]
tracing-grpc = ["tracing", "coglet_core/tracing-grpc"]
